<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Generator</title>
<style>
body{background:#0f172a;color:#fff;font-family:sans-serif;text-align:center;padding:30px}
.box{background:#1e293b;padding:20px;border-radius:12px;max-width:400px;margin:auto}
input{width:90%;padding:12px;border-radius:8px;border:none;text-align:center;font-size:18px}
button{margin-top:12px;padding:12px 20px;background:#22c55e;border:none;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<h2>🔐 Password Generator</h2>
<div class="box">
<input id="p" readonly>
<br><button onclick="gen()">Generate</button>
<button onclick="copyPass()">Copy</button>
</div>
<br><a href="./" style="color:#94a3b8">← Back</a>
<script>
function gen(){let s="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%";let r="";for(let i=0;i<16;i++)r+=s[Math.floor(Math.random()*s.length)];document.getElementById('p').value=r}
function copyPass(){let v=document.getElementById('p').value;navigator.clipboard.writeText(v).then(()=>alert('Copied!'))}
gen();
</script>
</body>
</html>
