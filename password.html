<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Password Generator - Jimmy</title><style>body{background:#0f172a;color:#fff;font-family:sans-serif;text-align:center;padding:20px}.box{background:#1e293b;padding:20px;border-radius:12px;max-width:400px;margin:auto}input{width:90%;padding:12px;border-radius:8px;border:none;text-align:center;font-size:18px}button{padding:12px 20px;background:#22c55e;border:none;border-radius:8px;font-weight:bold;margin:5px}</style></head><body><h2>🔐 Password Generator</h2><div class="box"><input id="p" readonly><br><br><button onclick="gen()">Generate</button><button onclick="copyT()">Copy</button></div><br><a href="./" style="color:#94a3b8">← Back to Home</a><script>function gen(){let c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%";let r="";for(let i=0;i<16;i++)r+=c[Math.floor(Math.random()*c.length)];document.getElementById('p').value=r}function copyT(){let v=document.getElementById('p').value;navigator.clipboard.writeText(v).then(()=>alert('Copied!'))}gen();</script></body></html>
