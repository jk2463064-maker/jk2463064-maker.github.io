<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>about movie- JimmyTools</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f0f13] text-white min-h-screen p-4">
<div class="max-w-6xl mx-auto">
  <h1 class="text-3xl font-bold">🎬 Dekhu Ya Nahi?</h1>
  <p class="text-gray-400">100 Movies • IMDb Rating Auto</p>
  <div class="flex gap-2 my-6 flex-wrap">
    <button onclick="filterCat('all')" class="cat-btn bg-purple-600 px-4 py-2 rounded-full">All 100</button>
    <button onclick="filterCat('bollywood')" class="cat-btn bg-zinc-800 px-4 py-2 rounded-full">Bollywood</button>
    <button onclick="filterCat('hollywood')" class="cat-btn bg-zinc-800 px-4 py-2 rounded-full">Hollywood</button>
    <button onclick="filterCat('south')" class="cat-btn bg-zinc-800 px-4 py-2 rounded-full">South</button>
  </div>
  <div class="bg-zinc-900 p-4 rounded-xl mb-6 flex gap-2">
    <input id="movieName" placeholder="Movie add kar - poster auto aayega" class="flex-1 bg-zinc-800 p-3 rounded-lg">
    <select id="movieCat" class="bg-zinc-800 p-3 rounded-lg"><option value="bollywood">Bollywood</option><option value="hollywood">Hollywood</option><option value="south">South</option></select>
    <button onclick="addMovie()" class="bg-purple-600 px-6 rounded-lg font-bold">Add</button>
  </div>
  <div id="movieGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
</div>
<script>
const OMDB_KEY = "thewdb";
async function getIMDbInfo(name){
  try{
    let r = await fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(name)}&apikey=${OMDB_KEY}`);
    let d = await r.json();
    if(d.Response=="True") return {rating:d.imdbRating, poster:d.Poster!="N/A"?d.Poster:"", year:d.Year};
  }catch(e){}
  return {rating:"N/A", poster:"", year:""};
}let defaultMovies = [
  {id:1, name:"Jawan", cat:"bollywood", must:78, one:15, bakar:7},
  {id:2, name:"Pathaan", cat:"bollywood", must:72, one:18, bakar:10},
  {id:3, name:"Animal", cat:"bollywood", must:45, one:30, bakar:25},
  {id:4, name:"12th Fail", cat:"bollywood", must:95, one:4, bakar:1},
  {id:5, name:"Dunki", cat:"bollywood", must:40, one:35, bakar:25},
  // ... baki 95 same format me next line pe
];
let movies = JSON.parse(localStorage.getItem('jimmy_100_final') || JSON.stringify(defaultMovies));
async function addMovie(){
  let name=document.getElementById('movieName').value.trim();
  let cat=document.getElementById('movieCat').value;
  if(!name) return alert("Naam likh bhai");
  let btn=document.querySelector('button[onclick="addMovie()"]'); btn.innerText="Fetching...";
  let info=await getIMDbInfo(name);
  movies.unshift({id:Date.now(), name, cat, must:0, one:0, bakar:0, rating:info.rating, poster:info.poster, year:info.year});
  localStorage.setItem('jimmy_100_final', JSON.stringify(movies));
  document.getElementById('movieName').value=''; btn.innerText="Add";
  render();
}
function vote(id,type){let m=movies.find(x=>x.id==id); m[type]++; localStorage.setItem('jimmy_100_final', JSON.stringify(movies)); render(currentFilter);}
let currentFilter='all';
function render(filter='all'){
  currentFilter=filter;
  let grid=document.getElementById('movieGrid');
  let filtered=filter=='all'?movies:movies.filter(m=>m.cat==filter);
  grid.innerHTML=filtered.map(m=>{
    let total=m.must+m.one+m.bakar||1; let mustP=Math.round(m.must/total*100);
    let verdict=mustP>=50?'🔥 Must Watch': m.bakar> m.must && m.bakar>m.one?'💩 Bakar Hai':'👌 One Time';
    return `<div class="bg-zinc-900 p-3 rounded-xl border border-zinc-800">
    ${m.poster?`<img src="${m.poster}" class="w-full h-72 object-cover rounded-lg">`:`<div class="w-full h-72 bg-zinc-800 rounded-lg flex items-center justify-center text-4xl">🎬</div>`}
    <h3 class="font-bold mt-2 truncate">${m.name} <span class="text-xs text-gray-500">${m.year||''}</span></h3>
    <p class="text-xs text-yellow-400">⭐ ${m.rating||'N/A'} • ${m.cat}</p>
    <p class="text-xs font-bold mt-1 ${mustP>=50?'text-green-400':'text-blue-400'}">${verdict} ${mustP}%</p>
    <div class="flex gap-1 mt-2"><button onclick="vote(${m.id},'must')" class="flex-1 bg-green-900/50 text-green-300 py-1 rounded text-[11px]">Must ${m.must}</button><button onclick="vote(${m.id},'one')" class="flex-1 bg-blue-900/50 text-blue-300 py-1 rounded text-[11px]">One ${m.one}</button><button onclick="vote(${m.id},'bakar')" class="flex-1 bg-red-900/50 text-red-300 py-1 rounded text-[11px]">Bakar ${m.bakar}</button></div>
    function filterCat(c){
  document.querySelectorAll('.cat-btn').forEach(b=>b.className='cat-btn bg-zinc-800 px-4 py-2 rounded-full');
  event.target.className='cat-btn bg-purple-600 px-4 py-2 rounded-full';
  render(c);
}

async function loadAllPosters(){
  for(let m of movies){
    if(!m.poster){
      let info = await getIMDbInfo(m.name);
      m.poster = info.poster;
      m.rating = info.rating;
      m.year = info.year;
      localStorage.setItem('jimmy_100_final', JSON.stringify(movies));
      render(currentFilter);
      await new Promise(r=>setTimeout(r, 800));
    }
  }
}

render();
loadAllPosters();
</script>
render();
</script>
</body>
</html>
