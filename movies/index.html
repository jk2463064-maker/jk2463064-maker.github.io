
    <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movie Hub - 1000 Movies</title><style>body{background:#0f0f0f;color:#fff;font-family:system-ui;margin:0}.top{background:#000;padding:12px;display:flex;gap:10px;position:sticky;top:0}.top a{color:#7c3aed;font-weight:800;text-decoration:none}input{flex:1;padding:8px 14px;border-radius:20px;border:0;background:#222;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}.card{background:#1e1e1e;border-radius:12px;overflow:hidden;cursor:pointer}.card img{width:100%;aspect-ratio:16/9;object-fit:cover}.card p{padding:8px;font-size:13px}</style></head><body><div class="top"><a href="/">← BACK</a><input id="q" placeholder="Search 1000 movies..."></div><div class="grid" id="g"></div><script>let all=[];fetch('/movies.json').then(r=>r.json()).then(d=>{all=d;render(d)});function render(list){const g=document.getElementById('g');g.innerHTML='';list.forEach(m=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<img src="https://img.youtube.com/vi/${m.id}/mqdefault.jpg" onerror="this.style.background='#222'"><p>${m.title}</p>`;c.onclick=()=>window.open('https://www.youtube.com/watch?v='+m.id,'_blank');g.appendChild(c)});}document.getElementById('q').addEventListener('input',e=>{const q=e.target.value.toLowerCase();render(all.filter(x=>x.title.toLowerCase().includes(q)))})</script></body></html>
