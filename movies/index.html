let movies = JSON.parse(localStorage.getItem('jimmy_movies') || JSON.stringify(defaultMovies));

function addMovie(){
  let name = document.getElementById('movieName').value;
  let cat = document.getElementById('movieCat').value;
  if(!name) return alert("Naam toh likh bhai");
  movies.unshift({id:Date.now(), name, cat, must:0, one:0, bakar:0});
  localStorage.setItem('jimmy_movies', JSON.stringify(movies));
  document.getElementById('movieName').value='';
  render();
}

function vote(id, type){
  let m = movies.find(x=>x.id==id);
  m[type]++;
  localStorage.setItem('jimmy_movies', JSON.stringify(movies));
  render();
}

function render(filter='all'){
  let grid = document.getElementById('movieGrid');
  let filtered = filter=='all'? movies : movies.filter(m=>m.cat==filter);
  grid.innerHTML = filtered.map(m=>{
    let total = m.must+m.one+m.bakar || 1;
    let mustP = Math.round(m.must/total*100);
    let oneP = Math.round(m.one/total*100);
    let bakarP = Math.round(m.bakar/total*100);
    let verdict = mustP>=50? '🔥 Must Watch' : oneP>=50? '👌 One Time' : bakarP>=50? '💩 Bakar Hai' : 'Voting...';
    return `
    <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800">
      <h3 class="font-bold text-lg">${m.name}</h3>
      <span class="text-xs bg-zinc-800 px-2 py-1 rounded">${m.cat}</span>
      <p class="mt-2 text-sm font-bold ${mustP>=50?'text-green-400':bakarP>=50?'text-red-400':'text-blue-400'}">${verdict} - ${mustP||0}%</p>
      <div class="mt-3 space-y-2">
        <div class="w-full bg-zinc-800 h-2 rounded"><div class="bg-green-400 h-2 rounded" style="width:${mustP}%"></div></div>
        <div class="flex gap-1">
          <button onclick="vote(${m.id},'must')" class="flex-1 bg-green-900/50 text-green-300 py-1.5 rounded text-xs">Must ${m.must}</button>
          <button onclick="vote(${m.id},'one')" class="flex-1 bg-blue-900/50 text-blue-300 py-1.5 rounded text-xs">One Time ${m.one}</button>
          <button onclick="vote(${m.id},'bakar')" class="flex-1 bg-red-900/50 text-red-300 py-1.5 rounded text-xs">Bakar ${m.bakar}</button>
        </div>
      </div>
    </div>`
  }).join('') || '<p class="text-gray-500">Koi movie nahi, upar se add kar.</p>';
}

function filterCat(c){
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.replace('bg-purple-600','bg-zinc-800'));
  event.target.classList.replace('bg-zinc-800','bg-purple-600');
  render(c);
}
