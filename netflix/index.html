<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaStream + Movie Hub</title>
<style>
*{margin:0;box-sizing:border-box}body{background:#0f0f0f;color:#fff;font-family:system-ui}
.nav{background:#000;padding:12px 16px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:10}
.logo{color:#E50914;font-weight:900;font-size:20px;text-decoration:none}
.search{flex:1;padding:8px 14px;border-radius:20px;border:0;background:#222;color:#fff}
.sec{padding:16px 12px 0 12px} .sec h2{font-size:18px;margin-bottom:10px;border-left:4px solid #E50914;padding-left:8px}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px} .row::-webkit-scrollbar{display:none}
.card{min-width:160px;background:#1e1e1e;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid #2a2a2a}
.card img{width:160px;height:90px;object-fit:cover;background:#222;display:block}
.card p{padding:6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:160px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
.grid .card{min-width:auto;width:100%} .grid .card img{width:100%;height:110px}
</style>
</head><body>
<div class="nav"><a href="/" class="logo">NOVASTREAM</a><input id="search" class="search" placeholder="Search 1000+ movies..."></div>

<div class="sec"><h2>🔥 Nova - P Rating Top Movies</h2><div class="row" id="novaRow"></div></div>
<div class="sec"><h2>🎬 Movie Hub - All Movies</h2><div class="grid" id="allGrid"></div></div>

<script>
let all=[];
async function load(){
 const r=await fetch('../movies.json?v='+Date.now());
 all=await r.json();
 render();
}
function makeCard(m){
 const d=document.createElement('div'); d.className='card';
 d.innerHTML=`<img src="https://img.youtube.com/vi/${m.id}/mqdefault.jpg" onerror="this.src='https://via.placeholder.com/160x90?text=No+Trailer'"><p>${m.title} ${m.rating?'⭐'+m.rating:''}</p>`;
 d.onclick=()=>window.open('https://www.youtube.com/watch?v='+m.id,'_blank');
 return d;
}
function render(){
 const nova=document.getElementById('novaRow'); const allGrid=document.getElementById('allGrid');
 nova.innerHTML=''; allGrid.innerHTML='';
 const pMovies = all.filter(m=> (m.rating && parseFloat(m.rating)>=7) || (m.cat&&m.cat.toLowerCase().includes('p')) );
 const top = pMovies.length>0 ? pMovies : all.slice(0,10);
 top.forEach(m=>nova.appendChild(makeCard(m)));
 all.forEach(m=>allGrid.appendChild(makeCard(m)));
}
document.getElementById('search').addEventListener('input',e=>{
 const q=e.target.value.toLowerCase();
 const filtered=all.filter(m=>m.title.toLowerCase().includes(q));
 const g=document.getElementById('allGrid'); g.innerHTML=''; filtered.forEach(m=>g.appendChild(makeCard(m)));
});
load();
</script>
</body></html>
