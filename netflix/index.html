<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaStream - Full Movies</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#141414;color:#fff;font-family:system-ui}
.nav{padding:12px 16px;background:#000;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:10}
.logo{color:#E50914;font-weight:900;font-size:20px;letter-spacing:1px}
.search{flex:1;max-width:350px;padding:8px 14px;border-radius:20px;border:0;background:#222;color:#fff;outline:none}
.cat{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;background:#000}
.cat button{padding:6px 14px;border-radius:20px;border:1px solid #333;background:#222;color:#aaa;white-space:nowrap;cursor:pointer}
.cat button.active{background:#E50914;color:#fff;border-color:#E50914}
.hero{height:56vw;max-height:420px;background:#000;position:relative}
.hero iframe{width:100%;height:100%;border:0}
.over{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#141414);padding:20px}
.row{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(135px, 1fr));gap:14px;padding-bottom:80px}
.card{background:#222;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:transform .15s}
.card:hover{transform:scale(1.04);border-color:#E50914}
.card img{width:100%;height:195px;object-fit:cover;background:#333;display:block}
.card .t{padding:8px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.load-more{display:block;margin:20px auto;padding:10px 24px;background:#E50914;color:#fff;border:0;border-radius:20px;font-weight:bold;cursor:pointer}
.addbar{padding:12px;background:#000;position:sticky;bottom:0;display:flex;gap:6px;z-index:10}
.addbar input{flex:1;padding:10px;border-radius:6px;border:0;background:#222;color:#fff;font-size:12px}
.addbar select{padding:10px;border-radius:6px;border:0;background:#222;color:#fff}
.addbar button{background:#E50914;color:#fff;padding:10px 16px;border:0;border-radius:6px;font-weight:900;cursor:pointer}
</style>
</head>
<body>

<div class="nav">
  <div class="logo">NOVASTREAM</div>
  <input id="search" class="search" placeholder="🔍 Search 1000+ movies..." oninput="doSearch()">
</div>

<div class="cat" id="cats">
  <button class="active" onclick="filterCat('All',this)">All</button>
  <button onclick="filterCat('Bollywood',this)">Bollywood</button>
  <button onclick="filterCat('South',this)">South</button>
  <button onclick="filterCat('Hollywood',this)">Hollywood</button>
  <button onclick="filterCat('My Added',this)">My Added</button>
</div>

<div class="hero">
  <iframe id="mainPlayer" src="https://www.youtube.com/embed/aqz-KE-bpKQ?autoplay=1&mute=1" allowfullscreen></iframe>
  <div class="over"><h2 id="mtitle">Big Buck Bunny - Full Movie</h2></div>
</div>

<div class="row">
  <h3 id="rowTitle" style="margin-bottom:12px">🔥 Full Movies Collection</h3>
  <div class="grid" id="list"></div>
  <button class="load-more" id="loadMoreBtn" onclick="loadMore()">Load More Movies</button>
</div>

<div class="addbar">
  <input id="mName" placeholder="Movie Title">
  <select id="mCat">
    <option>Bollywood</option>
    <option>South</option>
    <option>Hollywood</option>
  </select>
  <input id="mYt" placeholder="YouTube Video ID or Full Link">
  <button onclick="addNew()">ADD</button>
</div>

<script>
// Base library with curated working full movie IDs + dynamic catalog generator
const baseLibrary = [
  {name:"Big Buck Bunny", yt:"aqz-KE-bpKQ", cat:"Hollywood", time:"Full HD"},
  {name:"Sintel", yt:"eRsGyueVLvQ", cat:"Hollywood", time:"Full HD"},
  {name:"Tears of Steel", yt:"R6MlUcmOul8", cat:"Hollywood", time:"Full HD"},
  {name:"Khatta Meetha", yt:"My5L3qLhewg", cat:"Bollywood", time:"Full Movie"},
  {name:"Golmaal: Fun Unlimited", yt:"N58vVasIyko", cat:"Bollywood", time:"Full Movie"},
  {name:"Singham", yt:"2GfUx74697I", cat:"Bollywood", time:"Full Movie"},
  {name:"Hera Pheri", yt:"1U4zNl9k878", cat:"Bollywood", time:"Full Movie"},
  {name:"Welcome", yt:"e687h85lP8A", cat:"Bollywood", time:"Full Movie"},
  {name:"Magadheera (Hindi)", yt:"v8yvF-GvU7M", cat:"South", time:"Full Movie"},
  {name:"Sivaji The Boss (Hindi)", yt:"Uo3i6L3mN7o", cat:"South", time:"Full Movie"},
  {name:"Aparichit (Hindi)", yt:"9jLd1tZ9H3I", cat:"South", time:"Full Movie"},
  {name:"Robot (Enthiran Hindi)", yt:"L8K3e5x8zJk", cat:"South", time:"Full Movie"}
];

// Generate scalable database up to 1000+ titles dynamically
let movies = [...baseLibrary];
let saved = localStorage.getItem('nova_movies_v2');
if (saved) {
  try {
    const parsed = JSON.parse(saved);
    movies = [...parsed, ...movies];
  } catch (e) {}
}

// Fetch popular catalogs dynamically from public API to reach 1000+ entries
let page = 1;
let curCat = 'All';
let curSearch = '';

async function fetchOnlineCatalog() {
  try {
    // Fetches real movies metadata (TMDB/Archive Open API mirrors)
    const res = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=15d2ade7f4a5e33aa75de4ff429be075&page=${page}&sort_by=popularity.desc`);
    const data = await res.json();
    if (data.results) {
      const formatted = data.results.map(m => {
        let cat = 'Hollywood';
        if (m.original_language === 'hi') cat = 'Bollywood';
        else if (['te', 'ta', 'kn', 'ml'].includes(m.original_language)) cat = 'South';
        return {
          name: m.title,
          cat: cat,
          time: m.release_date ? m.release_date.split('-')[0] : 'Full',
          // Automatic YouTube query embed link fallback
          ytQuery: encodeURIComponent(m.title + " full movie hindi"),
          yt: null,
          img: m.poster_path ? `https://image.tmdb.org/t/p/w300${m.poster_path}` : ''
        };
      });
      movies.push(...formatted);
      render();
    }
  } catch (e) {
    console.log("Offline mode, using stored library");
  }
}

// Initial fetch
fetchOnlineCatalog();

function render(){
  let filtered = movies.filter(m => {
    let okCat = curCat === 'All' || (curCat === 'My Added' ? m.isUserAdded : m.cat === curCat);
    let okSearch = m.name.toLowerCase().includes(curSearch.toLowerCase());
    return okCat && okSearch;
  });

  const listEl = document.getElementById('list');
  listEl.innerHTML = filtered.map(m => {
    const poster = m.img || (m.yt ? `https://img.youtube.com/vi/${m.yt}/hqdefault.jpg` : `https://placehold.co/135x190/222/fff?text=${encodeURIComponent(m.name)}`);
    const safeTitle = m.name.replace(/'/g, "");
    const playParam = m.yt ? `'${m.yt}'` : `'QUERY:${m.ytQuery}'`;

    return `
      <div class="card" onclick="playMovie(${playParam}, '${safeTitle}')">
        <img src="${poster}" onerror="this.src='https://placehold.co/135x190/E50914/fff?text=${encodeURIComponent(m.name)}'">
        <div class="t">
          ${m.name}<br>
          <span style="color:#999;font-size:10px">${m.cat} • ${m.time}</span>
        </div>
      </div>`;
  }).join('') || `<div style="grid-column:1/-1;padding:40px;text-align:center;color:#666">No movies found</div>`;
}

function playMovie(ytOrQuery, name){
  document.getElementById('mtitle').innerText = name;
  let player = document.getElementById('mainPlayer');
  let ytUrl = "";

  if (ytOrQuery.startsWith('QUERY:')) {
    const q = ytOrQuery.replace('QUERY:', '');
    // Open directly on YouTube search if embed fails
    ytUrl = `https://www.youtube.com/results?search_query=${q}`;
    document.getElementById('mtitle').innerHTML = `${name} 
      <a href="${ytUrl}" target="_blank" style="font-size:13px;color:#E50914;margin-left:10px;text-decoration:underline;">[Watch on YouTube]</a>`;
    player.src = `https://www.youtube.com/embed?listType=search&list=${q}&autoplay=1`;
  } else {
    ytUrl = `https://www.youtube.com/watch?v=${ytOrQuery}`;
    document.getElementById('mtitle').innerHTML = `${name} 
      <a href="${ytUrl}" target="_blank" style="font-size:13px;color:#E50914;margin-left:10px;text-decoration:underline;">[Open in YouTube]</a>`;
    player.src = `https://www.youtube.com/embed/${ytOrQuery}?autoplay=1&origin=${window.location.origin}`;
  }
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function loadMore(){
  page++;
  fetchOnlineCatalog();
}

function filterCat(c, btn){
  curCat = c;
  document.querySelectorAll('.cat button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function doSearch(){
  curSearch = document.getElementById('search').value.trim();
  render();
}

function addNew(){
  let name = document.getElementById('mName').value.trim();
  let cat = document.getElementById('mCat').value;
  let yt = document.getElementById('mYt').value.trim();

  if(!yt) return alert("Please enter a YouTube video ID or link!");
  
  // Extract YouTube ID if full URL is pasted
  if(yt.includes("youtu.be/")) yt = yt.split("youtu.be/")[1].split("?")[0];
  if(yt.includes("v=")) yt = yt.split("v=")[1].split("&")[0];
  if(!name) name = "Movie " + yt;

  const newMovie = {
    name,
    yt,
    cat,
    time: "Full HD",
    isUserAdded: true,
    img: `https://img.youtube.com/vi/${yt}/hqdefault.jpg`
  };

  movies.unshift(newMovie);
  
  // Save user additions to local storage
  let savedLocal = JSON.parse(localStorage.getItem('nova_movies_v2') || '[]');
  savedLocal.unshift(newMovie);
  localStorage.setItem('nova_movies_v2', JSON.stringify(savedLocal));

  render();
  document.getElementById('mName').value = "";
  document.getElementById('mYt').value = "";
  alert("Added " + name + " to " + cat + "!");
}

render();
</script>
</body>
</html>
