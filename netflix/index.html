<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaStream - Action</title>
<style>
*{box-sizing:border-box;margin:0}body{background:#141414;color:#fff;font-family:system-ui}
.nav{padding:14px 20px;background:#000;display:flex;justify-content:space-between;position:sticky;top:0;z-index:99}
.logo{color:#e50914;font-weight:900;font-size:22px}
.hero{height:56vw;max-height:360px;background:#000;position:relative}
.hero iframe{width:100%;height:100%;border:0}
.hero .over{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#141414);padding:20px}
.row{padding:16px}.scroll{display:flex;gap:10px;overflow-x:auto}
.card{min-width:135px;background:#222;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent}
.card.active{border-color:#e50914}
.card img{width:100%;height:190px;object-fit:cover}
.card .t{padding:8px;font-size:11px;font-weight:700}
</style></head><body>
<div class="nav"><div class="logo">NOVASTREAM</div><div style="color:#666;font-size:11px">ACTION • FREE</div></div>

<div class="hero" id="playerBox">
<iframe id="mainPlayer" src="https://www.youtube.com/embed/YoHD9XEInc0?autoplay=0" allowfullscreen></iframe>
<div class="over"><h2 id="mtitle">Inception</h2><p style="color:#aaa;font-size:12px">Click below to play</p></div>
</div>

<div class="row"><h3>🔥 Action - 1 Click Play</h3><div class="scroll" id="list"></div></div>

<script>
let movies=[
{name:"Inception",yt:"YoHD9XEInc0",img:"https://image.tmdb.org/t/p/w300/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg"},
{name:"Interstellar",yt:"zSWdZVtXT7E",img:"https://image.tmdb.org/t/p/w300/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg"},
{name:"Avengers Endgame",yt:"TcMBFSGVi1c",img:"https://image.tmdb.org/t/p/w300/or06FN3Dka5tukK1e9sl16pB3iy.jpg"},
{name:"Spider-Man",yt:"JfVOs4VSpmA",img:"https://image.tmdb.org/t/p/w300/1E5baAaEse26fej7uHcjOgEE2t2.jpg"},
{name:"John Wick 4",yt:"qEVU3r4ESUs",img:"https://image.tmdb.org/t/p/w300/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg"},
{name:"Fast X",yt:"aOb15GVFId8",img:"https://image.tmdb.org/t/p/w300/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg"}
];
function render(){
document.getElementById('list').innerHTML=movies.map((m,i)=>`<div class="card ${i==0?'active':''}" id="c${i}" onclick="play(${i})"><img src="${m.img}"><div class="t">${m.name}</div></div>`).join('')
}
function play(i){
let m=movies[i];
document.getElementById('mtitle').innerText=m.name;
document.getElementById('mainPlayer').src=`https://www.youtube.com/embed/${m.yt}?autoplay=1`;
document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
document.getElementById('c'+i).classList.add('active');
window.scrollTo(0,0);
}
render();
</script>
</body></html>
