<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaStream - Full Movies</title>
<style>
*{box-sizing:border-box;margin:0}body{background:#141414;color:#fff;font-family:system-ui}
.nav{padding:14px 20px;background:#000;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{color:#E50914;font-weight:900;font-size:22px}
.hero{height:56vw;max-height:390px;background:#000;position:relative}
.hero iframe{width:100%;height:100%;border:0}
.over{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#141414);padding:20px}
.row{padding:16px}.scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}
.card{min-width:135px;max-width:135px;background:#222;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent}
.card.active{border-color:#E50914;transform:scale(1.05)}
.card img{width:100%;height:190px;object-fit:cover;background:#333}
.card.t{padding:8px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<div class="nav"><div class="logo">NOVASTREAM</div><div style="color:#666;font-size:11px">FULL MOVIES</div></div>

<div class="hero">
<iframe id="mainPlayer" src="https://www.youtube.com/embed/aqz-KE-bpKQ?autoplay=1&mute=1" allowfullscreen></iframe>
<div class="over"><h2 id="mtitle">Big Buck Bunny - Full Movie</h2></div>
</div>

<div class="row"><h3>🔥 Full Movies - No Trailer</h3><div class="scroll" id="list"></div></div>

<div style="padding:16px;background:#000;position:sticky;bottom:0;display:flex;gap:8px">
  <input id="mName" placeholder="Movie Name" style="flex:1;padding:10px;border-radius:6px;border:0;background:#222;color:#fff">
  <input id="mYt" placeholder="YouTube ID" style="flex:1;padding:10px;border-radius:6px;border:0;background:#222;color:#fff">
  <button onclick="addNew()" style="background:#E50914;color:#fff;padding:10px 16px;border:0;border-radius:6px;font-weight:900">ADD</button>
</div>

<script>
let movies=[
{name:"Big Buck Bunny - Full",time:"10:34",yt:"aqz-KE-bpKQ",img:"https://peach.blender.org/wp-content/uploads/title_anouncement.jpg?x11217"},
{name:"Sintel - Full Movie",time:"14:48",yt:"eRsGyueVLvQ",img:"https://img.youtube.com/vi/eRsGyueVLvQ/hqdefault.jpg"},
{name:"Tears of Steel - Full",time:"12:14",yt:"R6MlUcmOul8",img:"https://img.youtube.com/vi/R6MlUcmOul8/hqdefault.jpg"},
{name:"Elephants Dream - Full",time:"10:54",yt:"TLkAORQI1g",img:"https://img.youtube.com/vi/TLkAORQI1g/hqdefault.jpg"},
{name:"Night of Living Dead",time:"1h 36m",yt:"H91BxkQl8y4",img:"https://img.youtube.com/vi/H91BxkQl8y4/hqdefault.jpg"}
];

// saved load
let saved=localStorage.getItem('nova_movies');
if(saved){ movies=JSON.parse(saved); }

function render(){
 document.getElementById('list').innerHTML=movies.map((m,i)=>`
  <div class="card ${i==0?'active':''}" id="c${i}" onclick="play(${i})">
   <img src="${m.img}" onerror="this.src='https://via.placeholder.com/135x190/E50914/fff?text=${encodeURIComponent(m.name)}'">
   <div class="t">${m.name}<br><span style="color:#999;font-size:9px">${m.time}</span></div>
  </div>`).join('');
}
function play(i){
 let m=movies[i];
 document.getElementById('mtitle').innerText=m.name;
 document.getElementById('mainPlayer').src=`https://www.youtube.com/embed/${m.yt}?autoplay=1`;
 document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
 document.getElementById('c'+i).classList.add('active');
 window.scrollTo(0,0);
}
function addNew(){
  let name=document.getElementById('mName').value;
  let yt=document.getElementById('mYt').value;
  if(!name ||!yt) return alert("Naam aur YouTube ID daal!");
  if(yt.includes("v=")) yt=yt.split("v=")[1].split("&")[0];
  if(yt.includes("youtu.be/")) yt=yt.split("youtu.be/")[1];
  movies.push({name:name, yt:yt, time:"Full", img:`https://img.youtube.com/vi/${yt}/hqdefault.jpg`});
  localStorage.setItem('nova_movies', JSON.stringify(movies));
  render();
  document.getElementById('mName').value="";
  document.getElementById('mYt').value="";
  alert("Added! Ab Commit changes dabaa de");
}
render();
</script>
</body></html>
