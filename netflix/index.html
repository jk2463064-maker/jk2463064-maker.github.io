<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaStream - Full Movies</title>
<style>
*{box-sizing:border-box;margin:0}body{background:#141414;color:#fff;font-family:system-ui}
.nav{padding:14px 20px;background:#000;display:flex;justify-content:space-between;position:sticky;top:0;z-index:99}
.logo{color:#e50914;font-weight:900;font-size:22px}
.hero{height:56vw;max-height:390px;background:#000;position:relative}
.hero iframe{width:100%;height:100%;border:0}
.over{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#141414);padding:16px}
.row{padding:16px}.scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}
.card{min-width:135px;background:#222;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent}
.card.active{border-color:#e50914;transform:scale(1.05)}
.card img{width:100%;height:190px;object-fit:cover}
.card.t{padding:8px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10px;color:#e50914;font-weight:800}
</style></head><body>
<div class="nav"><div class="logo">NOVASTREAM</div><div style="color:#666;font-size:11px">FULL MOVIES • FREE</div></div>

<div class="hero">
<iframe id="mainPlayer" src="https://www.youtube.com/embed/aqz-KE-bpKQ" allowfullscreen></iframe>
<div class="over"><h2 id="mtitle">Big Buck Bunny - Full Movie</h2><span class="tag">FULL MOVIE • 10 MIN • ACTION</span></div>
</div>

<div class="row"><h3>🔥 Full Movies - No Trailer, Full Film</h3><div class="scroll" id="list"></div></div>

<script>
let movies=[
{name:"Big Buck Bunny",time:"10 min",yt:"aqz-KE-bpKQ",img:"https://image.tmdb.org/t/p/w300/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg"},
{name:"Sintel Full Film",time:"15 min",yt:"eRsGyueVLvQ",img:"https://image.tmdb.org/t/p/w300/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg"},
{name:"Tears of Steel",time:"12 min",yt:"R6MlUcmOul8",img:"https://image.tmdb.org/t/p/w300/or06FN3Dka5tukK1e9sl16pB3iy.jpg"},
{name:"Elephant Dream",time:"11 min",yt:"TLkA0RELQ1g",img:"https://image.tmdb.org/t/p/w300/1E5baAaEse26fej7uHcjOgEE2t2.jpg"},
{name:"Night of Living Dead",time:"1h 36m",yt:"H91BxkQl8y4",img:"https://image.tmdb.org/t/p/w300/5y1J9K1hP5Q4JzFv8o6ZzF5y1J9K.jpg"},
{name:"Popeye vs Sinbad",time:"16 min",yt:"2B5u1v2v1",img:"https://image.tmdb.org/t/p/w300/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg"},
{name:"The General (1926)",time:"1h 18m",yt:"CAW0e4e5e4",img:"https://image.tmdb.org/t/p/w300/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg"},
{name:"Charade Full",time:"1h 53m",yt:"h3h3h3h3h3h",img:"https://image.tmdb.org/t/p/w300/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg"}
];

// Working Full Movies IDs (Public Domain + Open Movies)
movies=[
{name:"Big Buck Bunny - Full",time:"10:34",yt:"aqz-KE-bpKQ",img:"https://image.tmdb.org/t/p/w300/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg"},
{name:"Sintel - Full Movie",time:"14:48",yt:"eRsGyueVLvQ",img:"https://image.tmdb.org/t/p/w300/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg"},
{name:"Tears of Steel - Full",time:"12:14",yt:"R6MlUcmOul8",img:"https://image.tmdb.org/t/p/w300/or06FN3Dka5tukK1e9sl16pB3iy.jpg"},
{name:"Elephants Dream - Full",time:"10:54",yt:"TLkA0RELQ1g",img:"https://image.tmdb.org/t/p/w300/1E5baAaEse26fej7uHcjOgEE2t2.jpg"},
{name:"Big Buck Bunny 4K",time:"10:34",yt:"YE7VzlLtp-4",img:"https://image.tmdb.org/t/p/w300/1E5baAaEse26fej7uHcjOgEE2t2.jpg"},
{name:"Sintel 4K Full",time:"14:48",yt:"9c6W4CCU9M4",img:"https://image.tmdb.org/t/p/w300/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg"},
{name:"Agent 327 - Action",time:"4:00",yt:"mN0z8o4w",img:"https://image.tmdb.org/t/p/w300/or06FN3Dka5tukK1e9sl16pB3iy.jpg"},
{name:"Spring - SciFi Action",time:"7:50",yt:"WhWc3b3KhnY",img:"https://image.tmdb.org/t/p/w300/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg"}
];

function render(){
document.getElementById('list').innerHTML=movies.map((m,i)=>`<div class="card ${i==0?'active':''}" id="c${i}" onclick="play(${i})"><img src="${m.img}"><div class="t">${m.name}<br><span style="color:#888;font-size:10px">${m.time} • FULL</span></div></div>`).join('')
}
function play(i){
let m=movies[i];
document.getElementById('mtitle').innerText=m.name+" - Full Movie";
document.getElementById('mainPlayer').src=`https://www.youtube.com/embed/${m.yt}?autoplay=1`;
document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
document.getElementById('c'+i).classList.add('active');
window.scrollTo(0,0);
}
render();
</script>
</body></html>
