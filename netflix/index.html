<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaStream</title>
<style>*{margin:0;box-sizing:border-box}body{background:#111;color:#fff;font-family:system-ui}.nav{background:#000;padding:12px;display:flex;gap:10px;position:sticky;top:0}.logo{color:#E50914;font-weight:900}.search{flex:1;padding:8px 14px;border-radius:20px;border:0;background:#222;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}.card{background:#222;border-radius:10px;overflow:hidden}.card img{width:100%;aspect-ratio:16/9;object-fit:cover}.card p{padding:8px;font-size:13px}</style>
</head><body>
<div class="nav"><a href="/" style="color:#E50914;font-weight:900;text-decoration:none">NOVASTREAM</a><input id="s" class="search" placeholder="Search 1000+ movies..."></div>
<div class="grid" id="grid"></div>
<script>
let all=[];
fetch('../movies.json?v='+Date.now()).then(r=>r.json()).then(d=>{all=d;render(d);});
function render(list){const g=document.getElementById('grid');g.innerHTML='';list.forEach(m=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<img src="https://img.youtube.com/vi/${m.id}/mqdefault.jpg"><p>${m.title}</p>`;c.onclick=()=>window.open('https://www.youtube.com/watch?v='+m.id,'_blank');g.appendChild(c);});}
document.getElementById('s').addEventListener('input',e=>{const q=e.target.value.toLowerCase();render(all.filter(m=>m.title.toLowerCase().includes(q)))});
</script>
</body></html>
