<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaStream - Action</title>
<style>
*{box-sizing:border-box;margin:0}body{background:#141414;color:#fff;font-family:system-ui}
.nav{padding:14px 20px;background:#000;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99}
.logo{color:#e50914;font-weight:900;font-size:22px;letter-spacing:1px}
.hero{position:relative;height:52vh;background:#000;overflow:hidden}
.hero video,.hero iframe{width:100%;height:100%;object-fit:cover}
.hero.over{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#141414);padding:20px}
.row{padding:16px}.row h3{margin-bottom:10px}
.scroll{display:flex;gap:10px;overflow-x:auto}
.card{min-width:135px;background:#222;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent}
.card.active{border-color:#e50914}
.card img{width:100%;height:190px;object-fit:cover}
.card.t{padding:8px;font-size:11px;font-weight:700}
</style></head><body>
<div class="nav"><div class="logo">NOVASTREAM</div><div style="font-size:11px;color:#888">ACTION • FREE</div></div>

<div class="hero" id="playerBox">
<video id="mainVideo" controls autoplay poster="https://image.tmdb.org/t/p/original/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg">
<source src="https://archive.org/download/Popeye_the_Sailor_Meets_Sinbad_the_Sailor/Popeye_the_Sailor_Meets_Sinbad_the_Sailor_512kb.mp4" type="video/mp4">
</video>
<div class="over"><h2 id="mtitle">Action Pack Loading...</h2><p id="mdesc" style="color:#aaa;font-size:12px">Click any poster below to play</p></div>
</div>

<div class="row"><h3>🔥 Action - 1 Click Play</h3><div class="scroll" id="list"></div></div>

<script>
let movies=[
{name:"Inception",desc:"Action • Sci-Fi",img:"https://image.tmdb.org/t/p/w300/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"},
{name:"Interstellar",desc:"Space Action",img:"https://image.tmdb.org/t/p/w300/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"},
{name:"Avengers Endgame",desc:"Superhero Action",img:"https://image.tmdb.org/t/p/w300/or06FN3Dka5tukK1e9sl16pB3iy.jpg",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"},
{name:"Joker",desc:"Action Drama",img:"https://image.tmdb.org/t/p/w300/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"},
{name:"Spider-Man",desc:"Action Adventure",img:"https://image.tmdb.org/t/p/w300/1E5baAaEse26fej7uHcjOgEE2t2.jpg",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"},
{name:"Fast & Furious",desc:"Car Action",img:"https://image.tmdb.org/t/p/w300/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4"}
];

function render(){
document.getElementById('list').innerHTML=movies.map((m,i)=>`<div class="card" id="c${i}" onclick="play(${i})"><img src="${m.img}"><div class="t">${m.name}</div></div>`).join('')
}
function play(i){
let m=movies[i];
document.getElementById('mtitle').innerText=m.name;
document.getElementById('mdesc').innerText=m.desc;
let v=document.getElementById('mainVideo');
v.src=m.video; v.play();
document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
document.getElementById('c'+i).classList.add('active');
window.scrollTo(0,0);
}
render(); play(0);
</script>
</body></html>
