<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaStream</title><style>body{background:#000;color:#fff;font-family:system-ui;margin:0}.top{background:#111;padding:12px;display:flex;gap:10px;align-items:center;position:sticky;top:0}.top a{color:#E50914;font-weight:800;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}.card{background:#1a1a1a;border-radius:12px;overflow:hidden;cursor:pointer}.card img{width:100%;aspect-ratio:16/9;object-fit:cover}.card p{padding:8px;font-size:13px}</style></head><body><div class="top"><a href="/">← BACK</a><b>NOVA</b><span id="s" style="font-size:11px;color:#888;margin-left:10px">Loading...</span></div><div class="grid" id="g"></div><script>fetch('/movies.json').then(r=>r.json()).then(d=>{document.getElementById('s').innerText=d.length+' movies';const g=document.getElementById('g');d.slice(0,20).forEach(m=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<img src="https://img.youtube.com/vi/${m.id}/mqdefault.jpg"><p>${m.title}</p>`;c.onclick=()=>window.open('https://youtu.be/'+m.id,'_blank');g.appendChild(c)})}).catch(()=>{document.getElementById('s').innerText='movies.json not found at root';})</script></body></html>
