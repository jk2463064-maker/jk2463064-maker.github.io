<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<title>Free Password Generator - Jimmy's Tools</title>
<meta name="description" content="Generate strong secure passwords instantly - Free tool by Jimmy Dhampur">
<style>body{background:#0f172a;color:#fff;font-family:sans-serif;text-align:center;padding:20px} .box{background:#1e293b;padding:20px;border-radius:12px;max-width:400px;margin:auto} input{width:90%;padding:12px;border-radius:8px;border:none;margin:10px 0;font-size:18px;text-align:center} button{padding:12px 20px;background:#22c55e;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:5px} button:hover{background:#16a34a}</style></head><body>
<h2>🔐 Password Generator</h2>
<div class="box">
<input id="pass" readonly placeholder="Click Generate">
<br>
<label>Length: <input type="number" id="len" value="16" min="6" max="50" style="width:60px"></label>
<br><br>
<button onclick="gen()">Generate</button>
<button onclick="copy()">Copy</button>
<p style="color:#94a3b8;font-size:12px">100% Secure - No password is stored</p>
</div>
<a href="../" style="color:#94a3b8;display:block;margin-top:20px">← Back to All Tools</a>
<script>
function gen(){
let l=document.getElementById('len').value;
let chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
let p=""; for(let i=0;i<l;i++){p+=chars.charAt(Math.floor(Math.random()*chars.length));}
document.getElementById('pass').value=p;
}
function copy(){let p=document.getElementById('pass'); p.select(); document.execCommand('copy'); alert('Copied!');}
gen();
</script>
</body></html>
