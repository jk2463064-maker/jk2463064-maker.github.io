<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Generator - Jimmy</title>
<style>
body{background:#0f172a;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
.box{background:#1e293b;padding:25px;border-radius:16px;max-width:400px;margin:20px auto}
input{width:100%;padding:14px;border-radius:10px;border:none;text-align:center;font-size:20px;font-weight:bold;box-sizing:border-box}
button{padding:12px 22px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin:6px;font-size:14px}
.gen{background:#22c55e;color:#000}.copy{background:#fff;color:#000}
a{color:#94a3b8;text-decoration:none}
</style>
</head>
<body>
<h2>🔐 Password Generator</h2>
<div class="box">
<input id="pwd" readonly>
<div style="margin-top:15px">
<button class="gen" onclick="generate()">Generate 🔄</button>
<button class="copy" onclick="copyNow()">Copy 📋</button>
</div>
<p id="msg" style="color:#22c55e;height:20px;margin-top:10px"></p>
</div>
<a href="./">← Back to Home</a>

<script>
function generate(){
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%&*";
  let pass = "";
  for(let i=0;i<16;i++){ pass += chars.charAt(Math.floor(Math.random()*chars.length)); }
  document.getElementById('pwd').value = pass;
  document.getElementById('msg').innerText = "";
}
async function copyNow(){
  const val = document.getElementById('pwd').value;
  if(!val) return;
  try{
    await navigator.clipboard.writeText(val);
    document.getElementById('msg').innerText = "Copied! ✅";
  }catch(e){
    // Fallback for Instagram browser
    const input = document.getElementById('pwd');
    input.select();
    input.setSelectionRange(0, 99999);
    document.execCommand('copy');
    document.getElementById('msg').innerText = "Copied! ✅";
  }
}
generate();
</script>
</body>
</html>
