<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSC mts Mock Test Free</title><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f8f9ff}.top{background:#fff;padding:10px;border-bottom:1px solid #eee;position:sticky;top:0;display:flex;justify-content:space-between}#t{background:#f59e0b;color:#fff;padding:5px 12px;border-radius:20px;font-weight:700}.box{max-width:600px;margin:14px auto;background:#fff;border-radius:16px;padding:18px}.opt{border:1px solid #e2e8f0;padding:10px;border-radius:8px;margin:7px 0;cursor:pointer}.opt.sel{border-color:#10b981;background:#ecfdf5}.btn{background:#10b981;color:#fff;border:0;padding:12px;width:100%;border-radius:10px;font-weight:700;margin-top:10px}</style></head><body>
<div class="top"><a href="../">← Back</a><div id="t">60:00</div><b>CHSL MOCK-1</b></div><div class="box" id="app"></div>
<script>
  const Q=[{q:"MTS ka full form?",o:["Multi Tasking Staff","Multi Technical Staff","Main Tasking Staff","None"],a:0},{q:"India ka sabse bada state area me?",o:["Rajasthan","MP","UP","Maharashtra"],a:0},{q:"Chai me kaun sa stimulant hota hai?",o:["Caffeine","Nicotine","Morphine","None"],a:0},{q:"100 ka square root?",o:["10","20","5","15"],a:0},{q:"Gandhi Ji ka janm kab?",o:["1869","1870","1868","1871"],a:0},{q:"1 km = ? meter",o:["100","1000","10000","500"],a:1},{q:"Antonym of Big?",o:["Small","Large","Huge","Giant"],a:0},{q:"Ramayan kisne likhi?",o:["Valmiki","Tulsidas","Ved Vyas","Kalidas"],a:0},{q:"50% of 80?",o:["40","30","50","20"],a:0},{q:"National Anthem kisne likha?",o:["Tagore","Bankim","Nehru","Gandhi"],a:0}];
let i=0,ans={},t=3600,iv;function render(){let q=Q[i];document.getElementById('app').innerHTML=`<b>Q${i+1}/${Q.length}</b> - ${q.q}<br><br>${q.o.map((x,j)=>`<div class='opt ${ans[i]==j?'sel':''}' onclick='ans[${i}]=${j};render()'>${x}</div>`).join('')}<button class='btn' onclick='next()'>${i==Q.length-1?'Submit':'Next'}</button>`}function next(){if(i<Q.length-1){i++;render()}else{fin()}}function fin(){let c=0;Q.forEach((q,k)=>{if(ans[k]==q.a)c++});let sc=c*2-(Object.keys(ans).length-c)*0.5;document.getElementById('app').innerHTML=`<center><h2>Result</h2><h1 style='color:#10b981;font-size:42px'>${sc}/20</h1><p>Correct ${c}/${Q.length}</p><button class='btn' onclick='location.reload()'>Retry</button><br><br><a href='../'>All Mocks</a></center>`;clearInterval(iv)}iv=setInterval(()=>{t--;document.getElementById('t').innerText=Math.floor(t/60)+":"+(t%60<10?'0':'')+t%60;if(t<=0)fin()},1000);render();
</script></body></html>
