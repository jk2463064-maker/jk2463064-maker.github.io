<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SSC MTS Mock Test Free</title><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f8f9ff}.top{background:#fff;padding:10px;border-bottom:1px solid #eee;position:sticky;top:0;display:flex;justify-content:space-between}#t{background:#f59e0b;color:#fff;padding:5px 12px;border-radius:20px;font-weight:700}.box{max-width:600px;margin:14px auto;background:#fff;border-radius:16px;padding:18px}.opt{border:1px solid #e2e8f0;padding:10px;border-radius:8px;margin:7px 0;cursor:pointer}.opt.sel{border-color:#f59e0b;background:#fffbeb}.btn{background:#f59e0b;color:#fff;border:0;padding:12px;width:100%;border-radius:10px;font-weight:700;margin-top:10px}</style></head><body><div class="top"><a href="../"> Back</a><div id="t">60:00</div><b>MTS MOCK-1</b></div><div class="box" id="app"></div><script>
const Q=[{q:"MTS me age limit kya hai?",o:["18-25","18-27","20-30","21-28"],a:0},{q:"MTS full form?",o:["Multi Tasking Staff","Main Task Staff","Multi Tech Staff","None"],a:0},{q:"50+50=?",o:["100","90","110","80"],a:0},{q:"Havaldar kis me aata hai?",o:["MTS","CGL","CHSL","Steno"],a:0},{q:"India ki capital?",o:["Delhi","Mumbai","Kolkata","Chennai"],a:0},{q:"2x2=?",o:["4","2","6","8"],a:0},{q:"Gandhi ji ka janm kab?",o:["1869","1947","1857","1900"],a:0},{q:"Opposite of Big?",o:["Small","Large","Huge","Tall"],a:0},{q:"10% of 200?",o:["20","10","30","40"],a:0},{q:"Sabse bada ocean?",o:["Pacific","Atlantic","Indian","Arctic"],a:0}];
let i=0,ans={},t=3600,iv;function render(){let q=Q[i];document.getElementById('app').innerHTML=`<b>Q${i+1}/${Q.length}</b> - ${q.q}<br><br>${q.o.map((x,j)=>`<div class='opt ${ans[i]==j?'sel':''}' onclick='ans[${i}]=${j};render()'>${x}</div>`).join('')}<br><button class='btn' onclick='next()'>${i==Q.length-1?'Submit':'Next'}</button>`}function next(){if(i<Q.length-1){i++;render()}else{fin()}}function fin(){let c=0;Q.forEach((q,k)=>{if(ans[k]==q.a)c++});let sc=c*2-(Object.keys(ans).length-c)*0.5;let msg=`*MTS Mock Result* 🎯%0AScore: ${sc}/20%0ACorrect: ${c}/${Q.length}%0ATry: ${location.href}`;document.getElementById('app').innerHTML=`<center><h2>Result</h2><h1 style='color:#f59e0b;font-size:42px'>${sc}/20</h1><p>Correct ${c}/${Q.length}</p><a href='https://wa.me/?text=${msg}' target='_blank' style='display:block;background:#25D366;color:#fff;padding:12px;border-radius:10px;text-decoration:none;font-weight:700;margin:10px 0'>WhatsApp pe Share 📱</a><button class='btn' onclick='location.reload()'>Retry 🔄</button><br><br><a href='../'>All Mocks</a></center>`;clearInterval(iv)}iv=setInterval(()=>{t--;document.getElementById('t').innerText=Math.floor(t/60)+":"+(t%60<10?'0':'')+t%60;if(t==0)fin()},1000);render();
</script></body></html>
