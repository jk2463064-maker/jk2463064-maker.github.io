<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSC steno Mock Test Free</title><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#ef4444}.top{background:#fff;padding:10px;border-bottom:1px solid #eee;position:sticky;top:0;display:flex;justify-content:space-between}#t{background:#10b981;color:#fff;padding:5px 12px;border-radius:20px;font-weight:700}.box{max-width:600px;margin:14px auto;background:#fff;border-radius:16px;padding:18px}.opt{border:1px solid #e2e8f0;padding:10px;border-radius:8px;margin:7px 0;cursor:pointer}.opt.sel{border-color:#10b981;background:#ecfdf5}.btn{background:#10b981;color:#fff;border:0;padding:12px;width:100%;border-radius:10px;font-weight:700;margin-top:10px}</style></head><body>
<div class="top"><a href="../">← Back</a><div id="t">60:00</div><b>CHSL MOCK-1</b></div><div class="box" id="app"></div>
<script>
const Q=[{q:"steno full form?",o:["stenographer","stenographer","stenographer","None"],a:0},{q:"10+2 ke liye kaunsa exam?",o:["CGL","CHSL","MTS","CPO"],a:1},{q:"Speed= Distance/?",o:["Time","Force","Work","Power"],a:0},{q:"Synonym of Happy?",o:["Sad","Joyful","Angry","Lazy"],a:1},{q:"Harappan script?",o:["Not Deciphered","Sanskrit","Tamil","Hindi"],a:0},{q:"2+2*3?",o:["8","6","10","12"],a:0},{q:"Largest ocean?",o:["Atlantic","Pacific","Indian","Arctic"],a:1},{q:"National Bird?",o:["Peacock","Parrot","Sparrow","Eagle"],a:0},{q:"15% of 200?",o:["20","30","15","25"],a:1},{q:"Article 21?",o:["Life & Liberty","Equality","Freedom","Religion"],a:0}];
let i=0,ans={},t=3600,iv;function render(){let q=Q[i];document.getElementById('app').innerHTML=`<b>Q${i+1}/${Q.length}</b> - ${q.q}<br><br>${q.o.map((x,j)=>`<div class='opt ${ans[i]==j?'sel':''}' onclick='ans[${i}]=${j};render()'>${x}</div>`).join('')}<button class='btn' onclick='next()'>${i==Q.length-1?'Submit':'Next'}</button>`}function next(){if(i<Q.length-1){i++;render()}else{fin()}}function fin(){let c=0;Q.forEach((q,k)=>{if(ans[k]==q.a)c++});let sc=c*2-(Object.keys(ans).length-c)*0.5;document.getElementById('app').innerHTML=`<center><h2>Result</h2><h1 style='color:#10b981;font-size:42px'>${sc}/20</h1><p>Correct ${c}/${Q.length}</p><button class='btn' onclick='location.reload()'>Retry</button><br><br><a href='../'>All Mocks</a></center>`;clearInterval(iv)}iv=setInterval(()=>{t--;document.getElementById('t').innerText=Math.floor(t/60)+":"+(t%60<10?'0':'')+t%60;if(t<=0)fin()},1000);render();
</script></body></html>
