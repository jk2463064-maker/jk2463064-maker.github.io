<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SSC Steno Mock Test Free</title><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f8f9ff}.top{background:#fff;padding:10px;border-bottom:1px solid #eee;position:sticky;top:0;display:flex;justify-content:space-between}#t{background:#ef4444;color:#fff;padding:5px 12px;border-radius:20px;font-weight:700}.box{max-width:600px;margin:14px auto;background:#fff;border-radius:16px;padding:18px}.opt{border:1px solid #e2e8f0;padding:10px;border-radius:8px;margin:7px 0;cursor:pointer}.opt.sel{border-color:#ef4444;background:#fef2f2}.btn{background:#ef4444;color:#fff;border:0;padding:12px;width:100%;border-radius:10px;font-weight:700;margin-top:10px}</style></head><body><div class="top"><a href="../"> Back</a><div id="t">120:00</div><b>STENO MOCK-1</b></div><div class="box" id="app"></div><script>
const Q=[{q:"Steno me skill test kya hota hai?",o:["Typing + Shorthand","Only Typing","Only Shorthand","Interview"],a:0},{q:"Grade C ki speed?",o:["100 wpm","80 wpm","120 wpm","60 wpm"],a:0},{q:"Shorthand kise kehte hain?",o:["Tezi se likhna","Dheere likhna","Bolna","Sunna"],a:0},{q:"Stenographer ka kaam?",o:["Dictation likhna","Teaching","Driving","Cooking"],a:0},{q:"80 wpm kis grade ki hai?",o:["Grade D","Grade C","Grade B","Grade A"],a:0},{q:"1000 words kitne minute me 100 wpm pe?",o:["10 min","5 min","20 min","15 min"],a:0},{q:"Steno me English ke alawa?",o:["Hindi bhi","Only English","No Hindi","Only Tamil"],a:0},{q:"Computer typing speed?",o:["40 wpm","20 wpm","100 wpm","10 wpm"],a:0},{q:"Dictation kaise di jati hai?",o:["Boli jati hai","Likhi jati hai","Dikhai jati hai","None"],a:0},{q:"SSC Steno exam kab hota hai?",o:["Har saal","2 saal me","5 saal me","Kabhi nahi"],a:0}];
let i=0,ans={},t=7200,iv;function render(){let q=Q[i];document.getElementById('app').innerHTML=`<b>Q${i+1}/${Q.length}</b> - ${q.q}<br><br>${q.o.map((x,j)=>`<div class='opt ${ans[i]==j?'sel':''}' onclick='ans[${i}]=${j};render()'>${x}</div>`).join('')}<br><button class='btn' onclick='next()'>${i==Q.length-1?'Submit':'Next'}</button>`}function next(){if(i<Q.length-1){i++;render()}else{fin()}}function fin(){let c=0;Q.forEach((q,k)=>{if(ans[k]==q.a)c++});let sc=c*2-(Object.keys(ans).length-c)*0.5;let msg=`*Steno Mock Result* 🎯%0AScore: ${sc}/20%0ACorrect: ${c}/${Q.length}%0ATry: ${location.href}`;document.getElementById('app').innerHTML=`<center><h2>Result</h2><h1 style='color:#ef4444;font-size:42px'>${sc}/20</h1><p>Correct ${c}/${Q.length}</p><a href='https://wa.me/?text=${msg}' target='_blank' style='display:block;background:#25D366;color:#fff;padding:12px;border-radius:10px;text-decoration:none;font-weight:700;margin:10px 0'>WhatsApp pe Share 📱</a><button class='btn' onclick='location.reload()'>Retry 🔄</button><br><br><a href='../'>All Mocks</a></center>`;clearInterval(iv)}iv=setInterval(()=>{t--;document.getElementById('t').innerText=Math.floor(t/60)+":"+(t%60<10?'0':'')+t%60;if(t==0)fin()},1000);render();
</script></body></html>
