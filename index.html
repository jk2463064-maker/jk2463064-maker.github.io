<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaStream</title>
<style>
*{box-sizing:border-box;margin:0}body{background:#111;color:#fff;font-family:system-ui}
.nav{background:#000;padding:12px;display:flex;gap:10px;position:sticky;top:0;z-index:9}
.logo{color:#E50914;font-weight:900}.search{flex:1;padding:8px 12px;border-radius:20px;border:0;background:#222;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
.card{background:#222;border-radius:8px;overflow:hidden;cursor:pointer}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#333}
.card p{padding:6px;font-size:13px}
.hero{width:100%;aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center}
.hero iframe{width:100%;height:100%;border:0}
.unavail{background:#222;padding:20px;text-align:center}
button.yt{margin-top:10px;padding:8px 16px;background:#E50914;border:0;color:#fff;border-radius:20px}
</style>
</head>
<body>
<div class="nav"><div class="logo">NOVASTREAM</div><input id="search" class="search" placeholder="Search..."></div>
<div class="hero" id="heroBox"><p>Select a movie below</p></div>
<div class="grid" id="grid"></div>
<script>
let allMovies=[];
async function init(){
 try{
  const r=await fetch('movies.json?v='+Date.now());
  allMovies=await r.json();
  render(allMovies);
 }catch(e){
  document.getElementById('grid').innerHTML='<p style="padding:20px">movies.json me error hai - comma check karo</p>';
 }
}
function render(list){
 const g=document.getElementById('grid');
 g.innerHTML='';
 list.forEach(m=>{
  const d=document.createElement('div');d.className='card';
  d.innerHTML=`<img src="https://img.youtube.com/vi/${m.id}/mqdefault.jpg" onerror="this.src='https://i.ytimg.com/vi/${m.id}/hqdefault.jpg'"><p>${m.title}</p>`;
  d.onclick=()=>play(m);
  g.appendChild(d);
 });
}
function play(m){
 const box=document.getElementById('heroBox');
 // Try embed, agar block hai toh button dikhao
 box.innerHTML=`<iframe src="https://www.youtube.com/embed/${m.id}?rel=0" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
 // 2 sec me check agar video load nahi hui toh direct link
 setTimeout(()=>{
  box.innerHTML+=`<div class="unavail"><p>${m.title}</p><button class="yt" onclick="window.open('https://www.youtube.com/watch?v=${m.id}','_blank')">▶ Watch on YouTube</button><p style="font-size:12px;color:#aaa;margin-top:8px">Embed blocked by YouTube</p></div>`;
 },2500);
 window.scrollTo(0,0);
}
document.getElementById('search').addEventListener('input',e=>{
 const q=e.target.value.toLowerCase();
 render(allMovies.filter(m=>m.title.toLowerCase().includes(q)));
});
init();
</script>
</body>
</html>
