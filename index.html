<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jimmy Tools - TinyWow Style</title><style>*{margin:0;box-sizing:border-box;font-family:system-ui}body{background:#f8fafc} .h{background:#fff;padding:14px 20px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between} .logo{font-weight:800} .logo span{color:#7c3aed} .w{max-width:900px;margin:0 auto;padding:20px} .search{width:100%;padding:14px;border-radius:30px;border:1px solid #e2e8f0;margin:15px 0} .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px} .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;text-decoration:none;color:#111} .card:hover{border-color:#7c3aed}</style></head><body><div class="h"><div class="logo">JIMMY<span>TOOLS</span></div><div style="font-size:12px">By Jimmy</div></div><div class="w"><h1 style="text-align:center">Every tool you need, FREE 🚀</h1><input id="s" class="search" placeholder="Search tools..."><div class="grid" id="g"></div></div><script>const tools=[{t:"Insta Video Downloader",d:"Reels Downloader",l:"/downloader/"},{t:"Insta Fonts",d:"Stylish Fonts",l:"/fonts/"},{t:"Password Generator",d:"Strong Password",l:"/password/"},{t:"QR Code Generator",d:"QR Maker",l:"/qr/"},{t:"Movie Hub",d:"1000+ Movies",l:"/netflix/"},{t:"Music Hub",d:"Music",l:"/music/"},{t:"YT Thumbnail",d:"Thumbnail HD",l:"/yt-thumbnail/"},{t:"SSC Mocks",d:"SSC Tests",l:"/ssc/"}];const g=document.getElementById('g');function render(a){g.innerHTML='';a.forEach(x=>g.innerHTML+=`<a href="${x.l}" class="card"><h3>${x.t}</h3><p style="font-size:12px;color:#64748b">${x.d}</p></a>`)}render(tools);document.getElementById('s').addEventListener('input',e=>{render(tools.filter(t=>t.t.toLowerCase().includes(e.target.value.toLowerCase())))})</script></body></html>
