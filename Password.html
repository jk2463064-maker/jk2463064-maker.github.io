<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<title>Password Generator - Jimmy</title>
<style>body{background:#0f172a;color:#fff;font-family:sans-serif;text-align:center;padding:20px} .box{background:#1e293b;padding:20px;border-radius:12px;max-width:400px;margin:auto} input{width:90%;padding:12px;border-radius:8px;border:none;margin:10px 0;font-size:18px;text-align:center} button{padding:12px 20px;background:#22c55e;border:none;border-radius:8px;font-weight:bold;cursor:pointer} button:hover{background:#16a34a}</style></head><body>
<h2>🔐 Password Generator</h2>
<div class="box">
<input id="pass" readonly>
<br><button onclick="gen()">Generate New</button>
<button onclick="copy()">Copy</button>
</div>
<br><a href="./" style="color:#94a3b8">← Back</a>
<script>
function gen(){let c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%";let p="";for(let i=0;i<16;i++){p+=c[Math.floor(Math.random()*c.length)]}document.getElementById('pass').value=p}
function copy(){let e=document.getElementById('pass');e.select();document.execCommand('copy');alert('Copied!')}
gen();
</script>
</body></html>
