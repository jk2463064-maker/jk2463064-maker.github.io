<script>
function gen(){let c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%";let p="";for(let i=0;i<16;i++){p+=c[Math.floor(Math.random()*c.length)]}document.getElementById('pass').value=p}
async function copy(){
 let t=document.getElementById('pass').value;
 try{ await navigator.clipboard.writeText(t); alert('Copied! ✅'); }
 catch(e){ let el=document.getElementById('pass'); el.select(); document.execCommand('copy'); alert('Copied!'); }
}
gen();
</script>
