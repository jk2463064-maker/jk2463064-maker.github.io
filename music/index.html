<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Music</title>
<style>body{margin:0;background:#111;color:#fff;font-family:sans-serif;padding:15px}h1{text-align:center}a{display:flex;align-items:center;gap:12px;background:#222;padding:14px;border-radius:14px;margin:10px 0;color:#fff;text-decoration:none;border:1px solid #333}b{flex:1}span{font-size:12px;color:#aaa;display:block}.btn{background:#fff;color:#000;padding:6px 14px;border-radius:20px;font-weight:800;font-size:12px}</style>
</head><body>
<h1>🎵 Free Music Alternatives</h1>
<input id="s" oninput="f()" placeholder="Search Spotify, Lofi, Punjabi..." style="width:100%;padding:12px;border-radius:25px;border:none;margin:10px 0">

<div id="box">
<a href="https://www.jamendo.com" target="_blank"><b>Jamendo<span>100% Free MP3 Download - No Copyright</span></b><div class="btn">Open</div></a>
<a href="https://audius.co" target="_blank"><b>Audius<span>Spotify Alternative - No Ads</span></b><div class="btn">Open</div></a>
<a href="https://soundcloud.com" target="_blank"><b>SoundCloud Free<span>Remix, Lofi, Punjabi</span></b><div class="btn">Open</div></a>
<a href="https://pixabay.com/music/" target="_blank"><b>Pixabay Music<span>Free MP3 Download</span></b><div class="btn">Download</div></a>
<a href="https://www.youtube.com/audiolibrary" target="_blank"><b>YT Audio Library<span>1000+ Free Songs</span></b><div class="btn">Download</div></a>
<a href="https://www.jiosaavn.com" target="_blank"><b>JioSaavn Free<span>Bollywood Free</span></b><div class="btn">Open</div></a>
</div>

<script>function f(){let q=document.getElementById('s').value.toLowerCase();document.querySelectorAll('#box a').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'flex':'none')}</script>
</body></html>
