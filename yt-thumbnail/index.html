<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Thumbnail Downloader HD - Free</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#0f0f13;color:#fff;text-align:center}
.top{padding:14px;background:#1a1a22;font-weight:800;position:sticky;top:0}
.hero{padding:28px 16px}.hero h1{margin:0;font-size:26px}.hero p{color:#a1a1aa;font-size:13px;margin-top:8px}
.box{max-width:650px;margin:0 auto;padding:0 16px}
input{width:100%;padding:16px 20px;border-radius:30px;border:1px solid #333;background:#1f1f28;color:#fff;outline:none;font-size:15px}
.btn{margin-top:14px;background:#ff0000;color:#fff;border:0;padding:12px 28px;border-radius:30px;font-weight:800;font-size:15px;cursor:pointer}
.grid{max-width:700px;margin:24px auto;padding:0 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.card{background:#1e1e29;border:1px solid #2a2a38;border-radius:18px;padding:12px}
.card img{width:100%;border-radius:12px}
.card a{display:block;margin-top:10px;background:#fff;color:#000;padding:8px;border-radius:20px;font-weight:800;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="top">🖼️ Thumbnail Downloader</div>
<div class="hero"><h1>YouTube Thumbnail Downloader</h1><p>Paste YouTube Link • Get HD Thumbnail in 1 Click - Free, No Login</p></div>
<div class="box">
<input id="url" placeholder="Paste YouTube link here - https://youtu.be/...">
<br><button class="btn" onclick="get()">Get Thumbnail HD</button>
</div>
<div class="grid" id="result"></div>
<script>
function get(){
let u=document.getElementById('url').value;
let id='';try{id=u.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/)[1];}catch(e){alert('Valid YouTube link daal bhai!');return}
let res=document.getElementById('result');
res.innerHTML=`
<div class="card"><img src="https://img.youtube.com/vi/${id}/maxresdefault.jpg"><a href="https://img.youtube.com/vi/${id}/maxresdefault.jpg" target="_blank" download>Download HD (1280x720)</a></div>
<div class="card"><img src="https://img.youtube.com/vi/${id}/hqdefault.jpg"><a href="https://img.youtube.com/vi/${id}/hqdefault.jpg" target="_blank" download>Download HQ (480x360)</a></div>
<div class="card"><img src="https://img.youtube.com/vi/${id}/mqdefault.jpg"><a href="https://img.youtube.com/vi/${id}/mqdefault.jpg" target="_blank" download>Download MQ (320x180)</a></div>
<div class="card"><img src="https://img.youtube.com/vi/${id}/sddefault.jpg"><a href="https://img.youtube.com/vi/${id}/sddefault.jpg" target="_blank" download>Download SD (640x480)</a></div>
`;
}
</script>
</body>
</html>
