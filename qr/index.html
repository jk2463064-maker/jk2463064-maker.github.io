<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Generator</title>
<style>body{background:#0f172a;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
input{padding:12px;width:90%;max-width:350px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;margin:10px 0}
button{padding:12px 20px;background:#22c55e;border:0;border-radius:8px;color:#000;font-weight:bold;cursor:pointer;margin:5px}
#qrcode{margin:20px auto;background:white;padding:15px;width:200px;height:200px;border-radius:12px;display:flex;align-items:center;justify-content:center}
a{color:#94a3b8}</style>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head><body>
<h2>🔳 QR Code Generator</h2>
<p style="color:#94a3b8">Link, Text, UPI, anything</p>
<input id="text" placeholder="Yaha link ya text likho...">
<br><button onclick="make()">Generate QR</button>
<div id="qrcode"></div>
<a href="../">← Back to Home</a>
<script>
let qr;
function make(){
 let t=document.getElementById('text').value;
 if(!t) return alert('Kuch likh toh sahi!');
 document.getElementById('qrcode').innerHTML='';
 qr=new QRCode(document.getElementById('qrcode'),{text:t,width:180,height:180});
}
</script>
</body></html>
